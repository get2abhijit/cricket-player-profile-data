name: Enrich Cricket Players

on:
  schedule:
    # Run every Sunday at 2 AM UTC (after weekend international matches)
    - cron: '0 2 * * 0'
  
  # Also allow manual trigger
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Re-enrich all players (not just new ones)'
        required: false
        default: 'false'

jobs:
  enrich:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run enrichment pipeline
        env:
          PYTHONIOENCODING: 'utf-8'
        run: |
          python pipeline.py --skip-espn
      
      - name: Run tests
        run: |
          python -m pytest tests/ -q
      
      - name: Check enrichment state
        run: |
          python -c "
          import json
          from pathlib import Path
          state = json.load(open('data/enrichment_state.json'))
          enriched = sum(1 for v in state.values() if v['has_data'])
          total = len(state)
          pct = 100 * enriched // total if total else 0
          print(f'Enriched: {enriched}/{total} ({pct}%)')
          "
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-data
          path: |
            output/
            data/cache/
            data/enrichment_state.json
          retention-days: 30
      
      - name: Commit results
        if: success()
        run: |
          git config user.name "Player Enrichment Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/ data/cache/ data/enrichment_state.json 2>/dev/null || true
          git commit -m "🏏 Auto-enrich: $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)" || true
          git push
      
      - name: Create summary
        run: |
          cat > RICHMENT_SUMMARY.txt << 'EOF'
          # Player Enrichment Run Summary
          
          - Timestamp: $(date -u)
          - Players processed: see log
          - Tests passed: $(python -m pytest tests/ -q 2>&1 | tail -1)
          - Enrichment state saved to: data/enrichment_state.json
          EOF
          cat RICHMENT_SUMMARY.txt

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/test-results.xml'
          check_name: 'Test Results'
          comment_mode: 'always'
