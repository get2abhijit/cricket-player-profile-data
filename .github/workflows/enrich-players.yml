name: Refresh Cricsheet And Enrich Players

on:
  schedule:
    # Step 1: refresh every 2 days from recently-added 2-day men feed.
    - cron: "20 2 */2 * *"
    # Step 2: weekly consolidation from recently-added 7-day men feed.
    - cron: "50 2 * * 0"
  workflow_dispatch:
    inputs:
      window_days:
        description: "Recent Cricsheet men feed window"
        required: true
        default: "7"
        type: choice
        options:
          - "2"
          - "7"
      no_fetch:
        description: "Run pipeline in --no-fetch mode"
        required: true
        default: false
        type: boolean
      workers:
        description: "Parallel workers for pipeline fetch phase"
        required: true
        default: "6"
        type: string
      force_pipeline:
        description: "Run pipeline even when refresh inputs are unchanged"
        required: true
        default: false
        type: boolean

concurrency:
  group: cricsheet-refresh-and-dashboard
  cancel-in-progress: false

jobs:
  refresh-and-enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      inputs_changed: ${{ steps.delta.outputs.changed }}
      pipeline_ran: ${{ steps.pipeline_gate.outputs.should_run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Restore match JSON cache
        id: matches_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: data/matches_json
          key: matches-json-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            matches-json-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve refresh window
        id: window
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            WINDOW_DAYS="${{ inputs.window_days }}"
          elif [[ "${{ github.event.schedule }}" == "50 2 * * 0" ]]; then
            WINDOW_DAYS="7"
          else
            WINDOW_DAYS="2"
          fi
          echo "days=${WINDOW_DAYS}" >> "$GITHUB_OUTPUT"
          echo "Using window_days=${WINDOW_DAYS}"

      - name: Refresh Cricsheet register and matches
        id: refresh
        run: |
          python tools/update_cricsheet_inputs.py \
            --window-days "${{ steps.window.outputs.days }}" \
            --summary-json data/automation_update_summary.json

      - name: Evaluate refresh delta
        id: delta
        shell: bash
        run: |
          python - << 'PY'
          import json
          import os

          summary_path = "data/automation_update_summary.json"
          with open(summary_path, "r", encoding="utf-8") as handle:
              summary = json.load(handle)

          changed = bool(summary.get("changed"))
          registry_changed = bool(summary.get("registry_changed"))
          matches_changed = bool(summary.get("matches_changed"))

          print(
              f"Refresh delta -> changed={changed}, "
              f"registry_changed={registry_changed}, matches_changed={matches_changed}"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"changed={'true' if changed else 'false'}\n")
          PY

      - name: Decide pipeline execution
        id: pipeline_gate
        env:
          INPUT_CHANGED: ${{ steps.delta.outputs.changed }}
          FORCE_PIPELINE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_pipeline) || false }}
        shell: bash
        run: |
          if [[ "${FORCE_PIPELINE}" == "true" || "${INPUT_CHANGED}" == "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Pipeline will run."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "No registry/match delta detected. Skipping pipeline + dashboard regeneration."
          fi

      - name: Run enrichment pipeline
        if: steps.pipeline_gate.outputs.should_run == 'true'
        env:
          WORKERS: ${{ inputs.workers || '6' }}
          NO_FETCH: ${{ inputs.no_fetch || false }}
        shell: bash
        run: |
          if [[ "${NO_FETCH}" == "true" ]]; then
            python pipeline.py --no-fetch --no-cleanup
          else
            python pipeline.py --workers "${WORKERS}" --retry-empty-cache
          fi

      - name: Run tests
        if: steps.pipeline_gate.outputs.should_run == 'true'
        run: |
          python -m pytest tests/ -q

      - name: Save match JSON cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/matches_json
          key: ${{ steps.matches_cache_restore.outputs.cache-primary-key }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-data
          path: |
            output/
            data/cache/
            data/enrichment_state.json
            data/matches_json/README.txt
            data/automation_update_summary.json
          retention-days: 30

      - name: Commit refreshed outputs
        if: success() && steps.pipeline_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "Player Enrichment Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            data/registry_csv/people.csv \
            data/registry_csv/names.csv \
            data/cache/profiles_raw.json \
            data/enrichment_state.json \
            output/player_profiles.json \
            output/dashboard_data.json \
            output/dashboard.html

          if git diff --cached --quiet; then
            echo "No committed output changes."
            exit 0
          fi

          git commit -m "Auto refresh + enrich ($(date -u +%Y-%m-%dT%H:%M:%SZ), window=${{ steps.window.outputs.days }}d)"
          git push

      - name: Ensure dashboard artifacts exist
        shell: bash
        run: |
          if [[ ! -f output/dashboard.html || ! -f output/dashboard_data.json ]]; then
            echo "Dashboard artifacts missing. Rebuilding from existing cache."
            python pipeline.py --no-fetch --no-cleanup
          fi

      - name: Prepare dashboard site bundle
        shell: bash
        run: |
          mkdir -p site
          cp output/dashboard.html site/index.html
          cp output/dashboard_data.json site/dashboard_data.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-dashboard:
    needs: refresh-and-enrich
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages status
        id: pages_status
        uses: actions/github-script@v7
        with:
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const enabled = repo.has_pages ? "true" : "false";
            core.setOutput("enabled", enabled);
            if (enabled !== "true") {
              core.notice(
                "GitHub Pages is not enabled for this repository. Skipping dashboard deployment."
              );
            }

      - name: Deploy to GitHub Pages
        if: steps.pages_status.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
